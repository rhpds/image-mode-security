project:
  slug: "image-mode-security"
  owner_email: "nlager@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "zero_touch"
  intake_type: "migration"
  automation_type: "ansible"
  description: "A hands-on lab covering some security features and how they apply to RHEL Image Mode.  Focusing on compliance policy and fapolicyd."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1643"
  workflow_id: "abdd0802-2914-47c1-bc58-b7a8059adc50"

spec:
  title: "Image Mode Security and Compliance"
  learning_objectives:
    - "Configure FAPolicyd application allow-listing in a bootc image"
    - "Implement a tailored CIS Server Level 1 SCAP policy at build time"
    - "Verify runtime security and compliance on the deployed bootc system"
  modules:                 # [{id, title, duration_min}] — written by intake Phase 4; id is stable (e.g. module-01)
    - id: module-01
      title: "Lab Introduction"
      duration_min: 3
      status: not_started
    - id: module-02
      title: "Adding Security Controls"
      duration_min: 10
      status: not_started
    - id: module-03
      title: "Testing Compliance"
      duration_min: 5
      status: not_started
  environment:
    platform: "rhel-vms"       # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"    # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student:
      - role: build-host
        count: 1
        cpu: 4
        ram_gb: 8
        disk_gb: 100
        os: rhel-10
      - role: bootc-vm
        count: 1
        cpu: 2
        ram_gb: 4
        disk_gb: 30
        os: rhel-10

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: "none"             # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: []              # named external service dependencies e.g. [github.com]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 0.3
  audience: "intermediate"   # beginner | intermediate | advanced

development:
  automation:
    ansible:
      status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: null
    assessment_strategy: ""
    catalog_gap: ""
    design_overview: "A hands-on intermediate lab on baking security and compliance into RHEL 10 Image Mode (bootc) images. Learners add FAPolicyd application allow-listing and a tailored CIS Server Level 1 SCAP policy to a Containerfile at build time, rebuild and push the hardened bootc image, then deploy it to a bootc VM and validate that the controls work. Runs across a build host and a bootc VM in roughly 18 minutes."
    module_summaries:
      - title: "Lab Introduction"
        overview: "Narrative overview that sets the lab goals and explains why build-time security offers consistency, immutability, auditability, and efficiency. Describes the two-machine environment (build host + bootc VM); no hands-on tasks."
      - title: "Adding Security Controls"
        overview: "Core hands-on module: edit the Containerfile to install and enable FAPolicyd plus audit/SELinux/OpenSCAP tooling, tailor a CIS Server Level 1 SCAP policy with autotailor and apply it with oscap-im, then build/push the hardened bootc image and apply it to the bootc VM."
      - title: "Testing Compliance"
        overview: "Validation module on the bootc VM: confirm FAPolicyd blocks an unapproved binary and run an OpenSCAP evaluation against the CIS Server Level 1 profile, expecting a compliance score in the 90s, then review why rules pass, fail, or are not applicable."
    rcars_overlap_pct: null
    rcars_top_matches: []
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
