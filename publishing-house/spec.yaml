approval_checklist:
  content:
    prerequisites_verifiable: null
    assessment_strategy: ''
    catalog_gap: 'The 98% match, "Image Mode is the best mode" (zt-image-mode-rh1),
      overlaps by design: this lab is a deliberate lift/compartmentalization of the
      security-and-compliance (FAPolicyd + OpenSCAP) modules from that 180-minute
      end-to-end lab, repackaged as a focused ~18-minute standalone follow-on so learners
      can drill build-time hardening (FAPolicyd allow-listing plus autotailor/oscap-im
      CIS Server L1 baked into the Containerfile, then runtime validation) without
      running the full bootc build/deploy/day-2 session. The content is intentionally
      the same. The FAPolicyd (zt-file-access-policy, zt-security-fapolicyd) and OpenSCAP
      (zt-openscap) labs each cover only one control on traditional RHEL with no bootc/Image
      Mode integration.'
    design_overview: A hands-on intermediate lab on baking security and compliance
      into RHEL 10 Image Mode (bootc) images. Learners add FAPolicyd application allow-listing
      and a tailored CIS Server Level 1 SCAP policy to a Containerfile at build time,
      rebuild and push the hardened bootc image, then deploy it to a bootc VM and
      validate that the controls work. Runs across a build host and a bootc VM in
      roughly 18 minutes.
    module_summaries:
    - title: Lab Introduction
      overview: Narrative overview that sets the lab goals and explains why build-time
        security offers consistency, immutability, auditability, and efficiency. Describes
        the two-machine environment (build host + bootc VM); no hands-on tasks.
    - title: Adding Security Controls
      overview: 'Core hands-on module: edit the Containerfile to install and enable
        FAPolicyd plus audit/SELinux/OpenSCAP tooling, tailor a CIS Server Level 1
        SCAP policy with autotailor and apply it with oscap-im, then build/push the
        hardened bootc image and apply it to the bootc VM.'
    - title: Testing Compliance
      overview: 'Validation module on the bootc VM: confirm FAPolicyd blocks an unapproved
        binary and run an OpenSCAP evaluation against the CIS Server Level 1 profile,
        expecting a compliance score in the 90s, then review why rules pass, fail,
        or are not applicable.'
    rcars_overlap_pct: 98
    rcars_top_matches:
    - title: Image Mode is the best mode
      ci_name: zt-rhelbu.zt-image-mode-rh1.prod
      url: https://catalog.demo.redhat.com/catalog?item=zt-rhelbu.zt-image-mode-rh1.prod
      relevance_score: 98
      why_it_fits: "Directly covers all three technologies \u2014 RHEL Image Mode\
        \ (bootc), FAPolicyd application allowlisting, and OpenSCAP SCAP compliance\
        \ at build time \u2014 in an intermediate hands-on format, but as one segment\
        \ of a 180-minute end-to-end lab."
    - title: File Access Policy
      ci_name: zt-rhelbu.zt-file-access-policy.prod
      url: https://catalog.demo.redhat.com/catalog?item=zt-rhelbu.zt-file-access-policy.prod
      relevance_score: 52
      why_it_fits: "Covers FAPolicyd allowlisting, trust databases, and enforcing/permissive\
        \ modes on traditional RHEL \u2014 one of the three topics, with no bootc/Image\
        \ Mode or OpenSCAP integration."
    - title: Enabling RHEL Security FAPolicyD 101
      ci_name: zt-rhelbu.zt-security-fapolicyd.prod
