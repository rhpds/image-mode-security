---
- name: Build inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add rhel VM host
      ansible.builtin.add_host:
        name: rhel
        ansible_ssh_host: rhel
        ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') }}"
        ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'ANSIBLE_USER') }}"
        ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PASSWORD') }}"

- name: E2E - build the image and validate the deployed guest
  hosts: rhel
  gather_facts: false
  become: true
  vars:
    scripts_path: "{{ playbook_dir }}/scripts"
    _showroom_env_guid: "{{ lookup('ansible.builtin.env', 'GUID') | default('') }}"
    _showroom_env_domain: "{{ lookup('ansible.builtin.env', 'DOMAIN') | default('') }}"
    scripts_in_order:
      - module-2-solve
      - module-2-validation
  tasks:
    - name: Run each build-host script in order
      ansible.builtin.include_tasks: tasks/run_script.yml
      loop: "{{ scripts_in_order }}"
      loop_control:
        loop_var: script_name

    - name: Validate the security exercises on the deployed Bootc guest
      ansible.builtin.include_tasks: tasks/validate_bootc.yml
